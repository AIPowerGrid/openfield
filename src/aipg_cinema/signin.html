<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in | AIPG Studio</title>
  <style>
    * { box-sizing:border-box; letter-spacing:0; }
    :root { color-scheme:light; font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#222522; }
    body { margin:0; background:#f5f6f3; min-height:100dvh; }
    header { min-height:76px; background:white; border-bottom:1px solid #dce0db; display:flex; align-items:center; gap:12px; padding:16px 28px; font-size:20px; font-weight:700; }
    header img { width:28px; height:28px; }
    main { width:min(100% - 40px,360px); margin:72px auto 40px; }
    h1 { font-size:24px; margin:0 0 28px; }
    button { width:100%; min-height:44px; padding:10px 14px; border:1px solid #cdd4cc; border-radius:4px; background:white; color:inherit; font:inherit; cursor:pointer; overflow-wrap:anywhere; }
    button:hover:not(:disabled) { border-color:#777d77; }
    button:focus-visible { outline:2px solid #1c806c; outline-offset:3px; }
    button:disabled { cursor:wait; opacity:.6; }
    #google-button { min-height:44px; width:100%; overflow:hidden; }
    #google-button[inert] { opacity:.6; }
    .divider { display:flex; align-items:center; gap:16px; margin:20px 0; color:#777d77; font-size:12px; }
    .divider::before,.divider::after { content:""; height:1px; background:#dce0db; flex:1; }
    #wallet-list { display:grid; gap:8px; margin-top:12px; }
    #wallet-list button { text-align:left; }
    #status { min-height:40px; margin:20px 0 0; line-height:1.6; overflow-wrap:anywhere; color:#536256; }
    #status[data-error=true] { color:#a33c2d; }
    [hidden] { display:none!important; }
    #retry { width:auto; margin-top:8px; }
    @media(max-width:400px) { header { padding:16px 20px; } main { margin-top:44px; } }
  </style>
  <script src="/signin.js" defer></script>
</head>
<body>
  <header><img src="/signin-mark.svg" alt="">AIPG Studio</header>
  <main>
    <h1>Sign in</h1>
    <div id="google-button" aria-label="Continue with Google" inert></div>
    <div class="divider">or</div>
    <button id="wallet" disabled>Continue with wallet</button>
    <div id="wallet-list" aria-label="Available wallets"></div>
    <p id="status" role="status" aria-live="polite">Restoring session...</p>
    <button id="retry" hidden>Try again</button>
  </main>
</body>
</html>
