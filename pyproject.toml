[project]
name = "aipg-cinema"
version = "0.0.1"
description = "Openfield open-source creative-video studio using the official Comfy SDK"
license = "MIT"
license-files = ["LICENSE", "workflows/COMFY-TEMPLATES-LICENSE.txt", "src/aipg_cinema/fonts/OFL.txt", "src/aipg_cinema/fonts/OFL-Michroma.txt", "src/aipg_cinema/fonts/OFL-Montserrat.txt", "src/aipg_cinema/fonts/OFL-PlayfairDisplay.txt"]
requires-python = ">=3.11"
dependencies = [
  "comfy-sdk>=0.5,<0.6",
  "fastapi>=0.115,<1",
  "starlette>=1.9,<2",
  "anyio>=4,<5",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.20,<1",
  "filelock>=3.16,<4",
  "pillow>=11,<13",
  "httpx>=0.28,<1",
  "faster-whisper>=1.1,<2",
]

[project.scripts]
aipg-cinema = "aipg_cinema.cli:main"
openfield = "aipg_cinema.app:main"
openfield-mcp = "aipg_cinema.mcp:main"
openreshoot = "aipg_cinema.app:main"
aipg-studio-staging = "aipg_cinema.hosted_server:main"
aipg-studio-maintenance = "aipg_cinema.maintenance:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
